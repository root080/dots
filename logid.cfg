devices: ({
	name: "MX Master 3S";

	buttons: ({
		cid: 0x52;
		action = {
			type: "Gestures";
			gestures: ({
				direction: "None";
				mode: "OnRelease";
				action = {
					type: "Keypress";
					keys: ["KEY_PLAYPAUSE"];
				};
			},
			{
				direction: "Right";
				mode: "OnRelease";
				action = {
					type: "Keypress";
					keys: ["KEY_NEXTSONG"];
				};
			},
			{
				direction: "Left";
				mode: "OnRelease";
				action = {
					type: "Keypress";
					keys: ["KEY_PREVIOUSSONG"];
				};
			}); 
		};
	});

	thumbwheel: {
		divert: true;
		invert: false;
		left: {
			mode: "OnInterval";
			interval: 1;
			action = {
				type: "Keypress";
				keys: ["KEY_VOLUMEDOWN"];
			};
		};
		right: {
			interval: 1;
			mode: "OnInterval";
			action = {
				type: "Keypress";
				keys: ["KEY_VOLUMEUP"];
			};
		};
	};
});
